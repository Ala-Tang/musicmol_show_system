<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var q = "";
      try {
        q = String(window.location.search || "");
      } catch (_e) {}
      if (/\bembed=unified\b/i.test(q)) {
        /* 须在首帧前挂上，否则 body 会先套用 musicmol-piano.css 里的 min-height:100vh + align-items:center，#app 被垂直居中，合一底栏 iframe 顶部出现整条「假留白」 */
        try {
          if (document.documentElement) document.documentElement.classList.add("musicmol-embed-unified");
        } catch (_e) {}
        document.write(
          '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />'
        );
      } else {
        document.write(
          '<meta name="viewport" content="width=1920, height=540, initial-scale=1.0, user-scalable=no" />'
        );
      }
    })();
  </script>
  <!-- 8766/8081 等仅托管 HTML 的映射：相对路径会错误地请求映射端口导致 404；在此把静态资源根指回运行 Flask 的同主机（默认 :5020）。 -->
  <!-- 其它端口：在本脚本之前执行 window.MUSICMOL_ASSET_BASE='http://主机:端口'; 或与 API 一致使用 ?musicmol_api=http://主机:5020 -->
  <script>
    (function () {
      function musicmolStaticOrigin() {
        if (typeof window !== "undefined" && window.MUSICMOL_ASSET_BASE) {
          return String(window.MUSICMOL_ASSET_BASE).replace(/\/$/, "");
        }
        try {
          var q = new URLSearchParams(location.search || "").get("musicmol_api");
          if (q && /^https?:\/\//i.test(q)) {
            return new URL(q, location.href).origin.replace(/\/$/, "");
          }
        } catch (e) {}
        var port = location.port || (location.protocol === "https:" ? "443" : "80");
        var host = location.hostname || "127.0.0.1";
        var proto = location.protocol === "https:" ? "https:" : "http:";
        if (port === "8081" || port === "8766") return proto + "//" + host + ":5020";
        return "";
      }
      var origin = musicmolStaticOrigin();
      if (origin) {
        var b = document.createElement("base");
        b.href = origin + "/";
        document.head.insertBefore(b, document.head.firstChild);
      }
    })();
  </script>
  <title>MusicMol · Piano</title>
  <link rel="stylesheet" href="musicmol-piano.css" />
</head>
<body>
  <div id="app" role="application" aria-label="MusicMol 钢琴">
    <!-- 约束框：1920×180 留白区域 -->
    <div class="constraint-box" id="constraint-box" aria-label="分子展示区域">
      <div class="constraint-placeholder"></div>
    </div>

    <header class="top-bar">
      <div class="top-bar-inner">
        <div class="nav-cluster nav-left">
          <div class="api-led-panel status-mode-panel" role="status" aria-live="polite" title="当前模式（由大屏接口同步）/ Mode from control API">
            <div class="api-led-unit api-led-unit--mode">
              <span class="api-led api-led--inert" aria-hidden="true"></span>
              <span class="api-led-label">
                <span class="api-led-zh" id="status-zh">模式：音乐生成分子</span>
                <span class="api-led-en" id="status-en">Mode: Music → Molecule</span>
              </span>
            </div>
          </div>
        </div>

        <div class="minimap-wrap" id="minimap-wrap" title="键盘范围：拖动透明框平移；右侧图标缩放可见键数 / Pan & resize viewport">
          <div class="minimap minimap-piano" id="minimap" aria-hidden="true"></div>
          <div class="minimap-shade minimap-shade--left" id="minimap-shade-l" aria-hidden="true"></div>
          <div class="minimap-shade minimap-shade--right" id="minimap-shade-r" aria-hidden="true"></div>
          <div class="minimap-viewport" id="minimap-viewport">
            <button type="button" class="minimap-viewport-resize" id="minimap-viewport-resize" aria-label="缩放可见白键数 / Resize visible keys" title="拖动调整可见白键数量 / Drag to resize">
              <svg class="minimap-resize-svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M4 14h2v4h4v2H4v-6zm16-4h-2V6h-4V4h6v6zM4 4h6v2H6v4H4V4zm16 16v-6h-2v4h-4v2h6z"/>
              </svg>
            </button>
          </div>
          <div class="minimap-external-prompt" id="minimap-external-prompt" hidden>
            <div class="minimap-external-inner">
              <div class="minimap-external-text" id="minimap-external-text"></div>
              <div class="minimap-external-btns">
                <button type="button" class="text-btn mini-tb midi-ext-btn" id="ext-midi-yes" title="演奏 / Play"><span class="midi-btn-bi">演奏</span><span class="midi-btn-sep">·</span><span class="midi-btn-bi en">Play</span></button>
                <button type="button" class="text-btn text-btn-secondary mini-tb midi-ext-btn" id="ext-midi-no" title="稍后 / Later"><span class="midi-btn-bi">稍后</span><span class="midi-btn-sep">·</span><span class="midi-btn-bi en">Later</span></button>
              </div>
            </div>
          </div>
          <div class="minimap-molecule-panel" id="minimap-molecule-panel" hidden aria-live="polite">
            <div class="minimap-molecule-inner" id="minimap-molecule-inner"></div>
          </div>
        </div>

        <div class="nav-cluster nav-right">
          <button type="button" class="text-btn text-btn-secondary bilingual-tb" id="btn-song" title="点歌 / Pick a demo song">
            <span class="bilingual-tb-inner">
              <span class="zh">点歌</span><span class="sep">/</span><span class="en">Songs</span>
            </span>
          </button>
          <button type="button" class="text-btn bilingual-tb" id="btn-molecule" title="生成分子（用当前弹奏直接推理）/ Infer from current play · Alt+点击打开五线谱 / Alt+click for score">
            <span class="bilingual-tb-inner">
              <span class="zh">生成分子</span><span class="sep">/</span><span class="en">Molecule</span>
            </span>
          </button>
          <button type="button" class="text-btn text-btn-secondary bilingual-tb" id="btn-reset" title="重置 / Reset">
            <span class="bilingual-tb-inner">
              <span class="zh">重置</span><span class="sep">/</span><span class="en">Reset</span>
            </span>
          </button>
        </div>
      </div>
    </header>

    <main class="keyboard-stage" id="keyboard-stage">
      <div id="ai-progress-slot" class="ai-progress-slot" hidden></div>
      <div id="auto-mode-hint" class="auto-mode-hint" hidden></div>
      <div class="keyboard" id="keyboard"></div>
      <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>
      <div class="molecule-toast" id="molecule-toast" hidden aria-live="polite"></div>
      <div id="score-overlay" class="score-overlay" hidden aria-hidden="true">
        <div class="score-overlay-card">
          <button type="button" class="score-close-btn" id="score-close" aria-label="关闭 / Close">×</button>
          <div class="score-sheet-scroll" id="score-sheet-scroll">
            <div class="score-sheet" id="score-sheet"></div>
          </div>
          <aside class="score-overlay-actions">
            <button type="button" class="text-btn text-btn-secondary bilingual-tb full" id="score-preview">
              <span class="bilingual-tb-inner"><span class="zh">试听</span><span class="sep">/</span><span class="en">Preview</span></span>
            </button>
            <button type="button" class="text-btn bilingual-tb full" id="score-send">
              <span class="bilingual-tb-inner"><span class="zh">确认发送</span><span class="sep">/</span><span class="en">Send</span></span>
            </button>
          </aside>
        </div>
      </div>

      <div id="song-overlay" class="song-overlay" hidden aria-hidden="true">
        <div class="song-overlay-card">
          <button type="button" class="score-close-btn" id="song-close" aria-label="关闭 / Close">×</button>
          <div class="song-overlay-body">
            <div class="song-list-wrap">
              <div class="song-list-title">示例钢琴曲 / Demo songs</div>
              <ul class="song-menu-list" id="song-menu-list"></ul>
            </div>
            <aside class="song-overlay-actions">
              <button type="button" class="text-btn bilingual-tb full" id="song-play" disabled>
                <span class="bilingual-tb-inner bilingual-tb-stack">
                  <span class="zh">播放</span>
                  <span class="en">Play</span>
                </span>
              </button>
              <button type="button" class="text-btn text-btn-secondary bilingual-tb full" id="song-exit">
                <span class="bilingual-tb-inner bilingual-tb-stack">
                  <span class="zh">退出</span>
                  <span class="en">Exit</span>
                </span>
              </button>
            </aside>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="demo-songs-data.js"></script>
  <script src="demo-songs-glass-meta.js"></script>
  <!-- sound-activity-logger.js 已暂时关闭 -->
  <!-- <script src="sound-activity-logger.js"></script> -->
  <script src="vendor/soundfont/acoustic_grand_piano-mp3.js"></script>
  <script src="musicmol-piano.js"></script>
</body>
</html>
